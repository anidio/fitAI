services:
  postgres:
    image: postgres:16-alpine
    container_name: fitai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: treinos-api
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d treinos-api"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fitai-network

  backend:
    build:
      context: ./Project-Gest-o-de-Treinos
      dockerfile: Dockerfile
    container_name: fitai-backend
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/treinos-api?schema=public
      - PORT=8081
      - NODE_ENV=development
      - BETTER_AUTH_URL=http://localhost:8081
      - BETTER_AUTH_SECRET=secret32characterslongfortesting!!
      - BETTER_AUTH_TRUSTED_ORIGINS=http://localhost:3000
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NODE_OPTIONS=--max-old-space-size=2048
    deploy:
      resources:
        limits:
          memory: 4G
    volumes:
      - ./Project-Gest-o-de-Treinos:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: sh -c "npm install --legacy-peer-deps --ignore-engines && npx prisma generate && npx prisma db push && npx tsx src/index.ts"
    healthcheck:
      test: ["CMD-SHELL","node -e \"require('http').get('http://localhost:8081',()=>process.exit(0)); setTimeout(()=>process.exit(1),2000)\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - fitai-network

  studio:
    build:
      context: ./Project-Gest-o-de-Treinos
      dockerfile: Dockerfile
    container_name: fitai-prisma-studio
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/treinos-api?schema=public
      - NODE_OPTIONS=--max-old-space-size=1024
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - ./Project-Gest-o-de-Treinos:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma studio --port 5555 --browser none
    networks:
      - fitai-network

volumes:
  postgres_data:

networks:
  fitai-network:
    driver: bridge
