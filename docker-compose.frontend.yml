services:
  frontend:
    build:
      context: ./fit-ai-frontend
      dockerfile: Dockerfile
    container_name: fitai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://host.docker.internal:8081
      - HOST=0.0.0.0
      - INTERNAL_API_URL=http://host.docker.internal:8081
      - BETTER_AUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_BETTER_AUTH_URL=http://localhost:3000
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_OPTIONS=--max-old-space-size=2048
    deploy:
      resources:
        limits:
          memory: 4G
    volumes:
      - ./fit-ai-frontend:/app
      - /app/node_modules
      - /app/.next
    stdin_open: true
    tty: true
    command: sh -c "node wait-for-backend.js host.docker.internal 8081 && npm run dev -- --hostname 0.0.0.0"
    networks:
      - fitai-network

networks:
  fitai-network:
    driver: bridge
